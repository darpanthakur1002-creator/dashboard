<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    
    <div class="sidebar">
        <h2>Dashboard</h2>
        <ul>
            <li>🏠 Home</li>
            <li>👤 Profile</li>
            <li>📊 Analytics</li>
            <li>📁 Projects</li>
            <li>⚙ Settings</li>
        </ul>
    </div>

    <div class="main">
        <div class="header">
            <h1>Welcome, Darpan!</h1>
        </div>

        <div class="cards">
            <div class="card">
                <h3>Total Projects</h3>
                <p>12</p>
            </div>

            <div class="card">
                <h3>Apps Created</h3>
                <p>5</p>
            </div>

            <div class="card">
                <h3>GitHub Repos</h3>
                <p>20</p>
            </div>

            <div class="card">
                <h3>Tasks Done</h3>
                <p>85%</p>
            </div>
        </div>
    </div>

</div>

</body>
</html>
